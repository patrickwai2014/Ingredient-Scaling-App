<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<title>Ingredient Calculator</title>

<style>
  /* iOS-style system colours */
  :root {
    --bg: #F2F2F7;              /* systemGroupedBackground */
    --cell: #FFFFFF;            /* secondarySystemGroupedBackground */
    --label: #000000;
    --label2: rgba(60,60,67,.6);  /* secondaryLabel */
    --label3: rgba(60,60,67,.3);  /* tertiaryLabel */
    --sep: rgba(60,60,67,.29);    /* separator */
    --fill: rgba(118,118,128,.12);/* tertiarySystemFill */
    --fill2: rgba(120,120,128,.16);
    --tint: #007AFF;
    --red: #FF3B30;
    --green: #34C759;
    --nav: rgba(249,249,249,.82);
    --hud: rgba(30,30,30,.86);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang TC", "Inter", "Noto Sans TC", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --cell: #1C1C1E; --label: #FFFFFF;
      --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.24); --fill2: rgba(120,120,128,.32);
      --tint: #0A84FF; --red: #FF453A; --green: #30D158;
      --nav: rgba(22,22,22,.8); --hud: rgba(60,60,60,.9);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--label); font-family: var(--font);
    font-size: 17px; line-height: 1.29; letter-spacing: -0.41px;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  input, textarea { -webkit-appearance: none; appearance: none; }
  button { -webkit-appearance: none; appearance: none; background: none; border: 0; padding: 0; cursor: pointer; }
  .page { max-width: 680px; margin: 0 auto; padding-bottom: 40px; }

  /* Navigation bar */
  .nav {
    position: sticky; top: 0; z-index: 20;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    min-height: 44px; padding: 0 8px;
    background: var(--nav); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  }
  .nav.bordered { box-shadow: 0 0.5px 0 var(--sep); }
  .nav-left, .nav-right { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .nav-right { justify-content: flex-end; }
  .nav-title { font-weight: 600; font-size: 17px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
  .nav-btn { color: var(--tint); font-size: 17px; padding: 10px 8px; display: inline-flex; align-items: center; gap: 2px; border-radius: 8px; white-space: nowrap; }
  .nav-btn:active { opacity: .35; }
  .nav-btn.bold { font-weight: 600; }
  .nav-btn[disabled] { color: var(--label3); }
  .nav-btn.icon { padding: 8px; }
  .nav-btn .back-label { max-width: 34vw; overflow: hidden; text-overflow: ellipsis; }

  .large-title { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: .37px; margin: 2px 20px 10px; }
  .detail-title { font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: .36px; margin: 6px 20px 4px; overflow-wrap: anywhere; }
  .detail-sub { color: var(--label2); font-size: 15px; margin: 0 20px 6px; letter-spacing: -0.24px; }

  /* Segmented control */
  .segmented { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; margin-right: 4px; }
  .segmented button { font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: 7px; color: var(--label); letter-spacing: -0.08px; }
  .segmented button[aria-pressed="true"] { background: var(--cell); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); font-weight: 600; }
  @media (prefers-color-scheme: dark) { .segmented button[aria-pressed="true"] { background: #636366; } }

  /* Search field */
  .search { position: relative; margin: 0 16px 14px; display: block; }
  .search input { width: 100%; height: 36px; border: 0; border-radius: 10px; background: var(--fill); padding: 0 10px 0 32px; font-size: 17px; outline: none; }
  .search input::placeholder { color: var(--label2); }
  .search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--label2); pointer-events: none; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }

  /* Inset grouped lists */
  .section { margin: 0 16px 35px; }
  .section-header { font-size: 13px; line-height: 18px; color: var(--label2); text-transform: uppercase; margin: 0 16px 7px; letter-spacing: -0.08px; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  html[lang="zh-Hant"] .section-header { text-transform: none; }
  .section-footer { font-size: 13px; line-height: 18px; color: var(--label2); margin: 7px 16px 0; letter-spacing: -0.08px; }
  .section-footer.error { color: var(--red); }
  .group { background: var(--cell); border-radius: 10px; overflow: hidden; }
  .cell { position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 11px 16px; width: 100%; text-align: left; background: var(--cell); }
  .cell + .cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--sep); }
  .cell.inset-more + .cell::before, .cell.ing + .cell::before { left: 52px; }
  button.cell:active, .cell.tappable:active { background: var(--fill2); }
  .cell .main { flex: 1; min-width: 0; }
  .cell .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .subtitle { font-size: 15px; color: var(--label2); letter-spacing: -0.24px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chev { color: var(--label3); flex: none; }
  .cell.action { color: var(--tint); justify-content: flex-start; }
  .cell.destructive { color: var(--red); justify-content: center; }
  .cell.center { justify-content: center; }

  /* Form cells */
  .cell input.field, .cell textarea.field { border: 0; outline: none; background: transparent; width: 100%; padding: 0; font-size: 17px; }
  .cell input.field::placeholder, .cell textarea.field::placeholder { color: var(--label3); }
  .cell textarea.field { min-height: 110px; resize: vertical; line-height: 1.35; }
  .cell .lbl { flex: none; }
  .pill-input { border: 0; outline: none; background: var(--fill); border-radius: 8px; height: 32px; padding: 0 8px; font-size: 17px; width: 100%; }
  .pill-input::placeholder { color: var(--label3); }
  .pill-input.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill-input.unit { color: var(--label2); }
  .invalid, .invalid::placeholder { color: var(--red) !important; }
  .pill-input.invalid { box-shadow: inset 0 0 0 1.5px var(--red); }
  .yield-row { display: grid; grid-template-columns: 1fr 96px 84px; gap: 8px; align-items: center; width: 100%; }
  .ing-row { display: grid; grid-template-columns: 24px minmax(0,1fr) 76px 64px; gap: 8px; align-items: center; width: 100%; }
  .minus { width: 22px; height: 22px; border-radius: 50%; background: var(--red); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .minus:active { opacity: .6; }
  .plus-circle { width: 22px; height: 22px; border-radius: 50%; background: var(--green); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; }

  /* Calculator */
  .calc-cell { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px; }
  .calc-cell input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 34px; font-weight: 700; letter-spacing: .37px; padding: 0; font-variant-numeric: tabular-nums; }
  .calc-cell input::placeholder { color: var(--label3); }
  .calc-cell .unit { color: var(--label2); font-size: 20px; font-weight: 600; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; }
  .chip { background: var(--fill); color: var(--tint); border-radius: 999px; padding: 6px 14px; font-size: 15px; font-weight: 500; letter-spacing: -0.24px; }
  .chip:active { opacity: .5; }
  .scale-badge { color: var(--tint); font-weight: 600; text-transform: none; }
  .res-cell .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .res-cell .vals { text-align: right; flex: none; }
  .res-cell .new { font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: .38px; }
  .res-cell .new .u { font-size: 15px; font-weight: 500; margin-left: 2px; color: var(--label2); letter-spacing: -0.24px; }
  .res-cell .orig { color: var(--label2); font-size: 13px; font-variant-numeric: tabular-nums; letter-spacing: -0.08px; margin-top: 1px; }
  .placeholder-cell { color: var(--label2); }
  .notes-text { white-space: pre-wrap; overflow-wrap: anywhere; }

  .empty-state { text-align: center; padding: 70px 32px 30px; }
  .empty-state svg { color: var(--label3); }
  .empty-state h2 { font-size: 22px; font-weight: 700; margin: 14px 0 6px; letter-spacing: .35px; }
  .empty-state p { color: var(--label2); font-size: 15px; margin: 0 0 20px; letter-spacing: -0.24px; }
  .filled-btn { background: var(--tint); color: #fff; font-weight: 600; border-radius: 12px; padding: 14px 22px; font-size: 17px; display: inline-flex; align-items: center; gap: 6px; }
  .filled-btn:active { opacity: .7; }
  .loading { text-align: center; color: var(--label2); padding: 60px 20px; }
  .spinner { width: 22px; height: 22px; border: 2.5px solid var(--fill2); border-top-color: var(--label2); border-radius: 50%; margin: 0 auto 12px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .storage-note { text-align: center; font-size: 13px; color: var(--label2); margin: 0 32px; letter-spacing: -0.08px; line-height: 18px; }

  /* HUD toast */
  .toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); background: var(--hud); color: #fff; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); padding: 10px 18px; border-radius: 999px; font-size: 15px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: calc(100% - 40px); z-index: 60; text-align: center; letter-spacing: -0.24px; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--red); }

  /* Sheets */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; z-index: 40; animation: fade .2s ease; }
  .overlay[hidden] { display: none; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(40px); opacity: .6; } }
  .modal { width: 100%; max-width: 560px; animation: rise .25s cubic-bezier(.2,.8,.2,1); }
  .sheet { background: var(--bg); border-radius: 12px 12px 0 0; max-height: 92vh; overflow: auto; padding-bottom: env(safe-area-inset-bottom, 0); }
  .sheet .nav { background: var(--bg); border-radius: 12px 12px 0 0; }
  .sheet .sheet-body { padding: 8px 0 24px; }
  .sheet .lead { color: var(--label2); font-size: 15px; margin: 0 32px 18px; text-align: center; letter-spacing: -0.24px; }
  .sheet textarea.field { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; min-height: 160px; letter-spacing: 0; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 6px auto 0; }
  .action-sheet { padding: 0 8px calc(8px + env(safe-area-inset-bottom, 0)); }
  .action-group { background: var(--nav); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
  @media (prefers-color-scheme: light) { .action-group { background: rgba(249,249,249,.94); } }
  .action-head { padding: 14px 16px; text-align: center; font-size: 13px; color: var(--label2); letter-spacing: -0.08px; }
  .action-head strong { display: block; font-weight: 600; margin-bottom: 2px; }
  .action-btn { display: block; width: 100%; min-height: 57px; font-size: 20px; color: var(--tint); text-align: center; position: relative; letter-spacing: .38px; }
  .action-btn::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 0.5px; background: var(--sep); }
  .action-group .action-btn:first-child:not(.after-head)::before { display: none; }
  .action-btn:active { background: var(--fill2); }
  .action-btn.destructive { color: var(--red); }
  .action-btn.cancel { font-weight: 600; background: var(--cell); }
  .action-btn.cancel::before { display: none; }
  @media (min-width: 600px) {
    .overlay { align-items: center; }
    .sheet { border-radius: 14px; }
    .sheet .nav { border-radius: 14px 14px 0 0; }
    .grabber { display: none; }
  }

  .file-btn { color: var(--tint); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  :focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; border-radius: 6px; }
  .cell input:focus-visible, .cell textarea:focus-visible, .search input:focus-visible { outline: none; }

  @media (max-width: 380px) {
    .ing-row { grid-template-columns: 24px minmax(0,1fr) 64px 54px; gap: 6px; }
    .yield-row { grid-template-columns: 1fr 76px 70px; }
  }
</style>
</head>

      loading: "正在載入食譜……",
      loadSlow: "仍在載入——暫時未能取得你的食譜，請檢查網絡連線。",
      loadErr: "未能載入已儲存的食譜，請重新打開頁面。",
      saveErr: "未能儲存，請再試一次。",
      saveErrPerm: "你沒有權限在此儲存。請要求擁有者給你「Contributor」權限。",
      notFound: "此食譜已不存在。",
      untitled: "未命名",
      copySuffix: "（副本）",
      duplicate: "複製食譜",
      duplicated: "已複製食譜"
    }
  };

  const LANG_KEY = "ingcalc.lang";
  const LS_KEY = "ingcalc.recipes.v1";

  let lang = (function () {
    try { const s = localStorage.getItem(LANG_KEY); if (s === "en" || s === "zh") return s; } catch (e) {}
    return (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
  })();

  function t(key, ...args) {
    const v = (I18N[lang] && I18N[lang][key] !== undefined) ? I18N[lang][key] : I18N.en[key];
    return typeof v === "function" ? v(...args) : (v ?? key);
  }

  /* ---------------- Helpers ---------------- */
  const $ = (sel, root = document) => root.querySelector(sel);
  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function newId() {
    return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function toNum(v) {
    if (typeof v === "number") return v;
    const s = String(v ?? "").trim().replace(",", ".");
    if (s === "") return NaN;
    return Number(s);
  }
  // Rounding rule: whole numbers; amounts under 1 keep one decimal (two if still 0)
  function fmt(n) {
    if (!isFinite(n)) return "–";
    if (n === 0) return "0";
    const a = Math.abs(n);
    if (a >= 1) return String(Math.round(n));
    let v = Math.round(n * 10) / 10;
    if (v === 0) v = Math.round(n * 100) / 100;
    if (v === 0) return "<0.01";
    return String(v);
  }
  // Show original amounts as entered (trim long decimals)
  function fmtOrig(n) {
    if (!isFinite(n)) return "–";
    return String(Math.round(n * 1000) / 1000);
  }
  function fmtFactor(f) {
    if (!isFinite(f)) return "–";
    return String(Math.round(f * 100) / 100);
  }

  // Recipe shape (units kept separate so conversion can be added later):
  // { id, name, yieldAmount, yieldUnit, ingredients:[{name, amount, unit}], notes, createdAt, updatedAt, schema:1 }
  function normalize(r) {
    if (!r || typeof r !== "object") return null;
    const yieldAmount = toNum(r.yieldAmount);
    const ings = Array.isArray(r.ingredients) ? r.ingredients : [];
    const ingredients = ings
      .filter(i => i && typeof i === "object")
      .map(i => ({ name: String(i.name ?? "").slice(0, 200), amount: toNum(i.amount), unit: String(i.unit ?? "").slice(0, 40) }))
      .filter(i => i.name.trim() !== "" && isFinite(i.amount) && i.amount >= 0);
    if (!String(r.name ?? "").trim() || !(yieldAmount > 0)) return null;
    return {
      id: (typeof r.id === "string" && /^[A-Za-z0-9_\-.~:@+]{1,100}$/.test(r.id) && r.id !== "." && r.id !== "..") ? r.id : newId(),
      name: String(r.name).trim().slice(0, 200),
      yieldAmount,
      yieldUnit: String(r.yieldUnit ?? "").trim().slice(0, 40),
      ingredients,
      notes: String(r.notes ?? "").slice(0, 20000),
      createdAt: typeof r.createdAt === "number" ? r.createdAt : Date.now(),
      updatedAt: typeof r.updatedAt === "number" ? r.updatedAt : Date.now(),
      schema: 1
    };
  }
  function sortRecipes(arr) {
    return arr.slice().sort((a, b) => a.name.localeCompare(b.name, lang === "zh" ? "zh-Hant" : "en", { sensitivity: "base" }));
  }

  /* ---------------- State ---------------- */
  const state = {
    view: "list",       // list | edit | calc
    recipes: [],
    loaded: false,
    slow: false,
    loadError: false,
    query: "",
    editId: null,
    draft: null,
    errors: null,
    calcId: null,
    target: ""
  };
  function getRecipe(id) { return state.recipes.find(r => r.id === id) || null; }

  /* ---------------- Storage ---------------- */
  // "cloud" = Claude artifact database (per-person, private)
  // "local" = this browser's localStorage (e.g. on GitHub Pages)
  // "memory" = nothing persists (storage blocked)
  const Store = { mode: null, col: null };

  function lsRead() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.map(normalize).filter(Boolean) : [];
    } catch (e) { return null; }
  }
  function lsWrite(arr) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); return true; } catch (e) { return false; }
  }

  function inFrame() {
    try { return window.self !== window.top; } catch (e) { return true; }
  }
  async function waitForClaude(ms) {
    const start = Date.now();
    while (!(window.claude && typeof window.claude.use === "function")) {
      if (Date.now() - start > ms) return null;
      await new Promise(r => setTimeout(r, 100));
    }
    return window.claude;
  }

  async function initStorage() {
    if (inFrame()) {
      const c = await waitForClaude(3000);
      if (c) {
        try {
          const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
          const uid = user ? await user.id() : null;
          if (db && uid) { startCloud(db, uid); return; }
        } catch (e) { /* fall back to local */ }
      }
    }
    startLocal();
  }

  function startLocal() {
    const arr = lsRead();
    if (arr === null) {
      Store.mode = "memory";
      state.recipes = [];
    } else {
      Store.mode = lsWrite(arr) ? "local" : "memory";
      state.recipes = arr;
    }
    state.loaded = true;
    renderStorageNote();
    onRecipesChanged();
  }

  function startCloud(db, uid) {
    Store.mode = "cloud";
    Store.col = db.collection("data/users/" + uid);
    renderStorageNote();
    const timer = setTimeout(() => { if (!state.loaded) { state.slow = true; onRecipesChanged(); } }, 10000);
    Store.col.onSnapshot(snap => {
      state.recipes = snap.docs.filter(d => d.exists).map(d => normalize(Object.assign({}, d.data(), { id: d.id }))).filter(Boolean);
      if (!snap.metadata.fromCache) { clearTimeout(timer); state.slow = false; }
      state.loaded = true;
      onRecipesChanged();
    }, err => {
      clearTimeout(timer);
      state.loaded = true;
      state.slow = false;
      state.loadError = true;
      onRecipesChanged();
    });
  }

  async function saveRecipe(r) {
    // optimistic local state
    const i = state.recipes.findIndex(x => x.id === r.id);
    if (i >= 0) state.recipes[i] = r; else state.recipes.push(r);
    if (Store.mode === "cloud") {
      await Store.col.doc(r.id).set(r);
    } else if (Store.mode === "local") {
      if (!lsWrite(state.recipes)) throw { code: "local" };
    }
  }
  async function deleteRecipe(id) {
    state.recipes = state.recipes.filter(x => x.id !== id);
    if (Store.mode === "cloud") {
      await Store.col.doc(id).delete();
    } else if (Store.mode === "local") {
      if (!lsWrite(state.recipes)) throw { code: "local" };
    }
  }
  function saveErrorMsg(e) {
    return (e && e.code === "invalid_argument") ? t("saveErrPerm") : t("saveErr");
  }

  function renderStorageNote() {
    const el = $("#storageNote");
    if (!Store.mode) { el.hidden = true; return; }
    el.hidden = false;
    $("#storageText").textContent = Store.mode === "cloud" ? t("storageCloud") : Store.mode === "local" ? t("storageLocal") : t("storageNone");
  }

  /* ---------------- Toast ---------------- */
  let toastTimer = null;
  function toast(msg, isError) {
    const el = $("#toast");
    el.textContent = msg;
    el.classList.toggle("error", !!isError);
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), isError ? 4500 : 2200);
  }

  /* ---------------- Extra strings for the iOS layout ---------------- */
  Object.assign(I18N.en, {
    recipesBack: "Recipes",
    save: "Save",
    deleteRecipe: "Delete Recipe",
    nameSection: "Recipe",
    yieldSection: "This recipe makes",
    noRecipesTitle: "No Recipes",
    emptyHint: "Tap + to add your first recipe.",
    addFirst: "Add Recipe",
    youNeed: "You will need",
    importFrom: "Choose Backup File…",
    pasteHeader: "Or paste backup text",
    exportHeader: "Backup text",
    copyText: "Copy Text",
    downloadFile: "Download File",
    done: "Done"
  });
  Object.assign(I18N.zh, {
    recipesBack: "食譜",
    save: "儲存",
    deleteRecipe: "刪除食譜",
    nameSection: "食譜",
    yieldSection: "此食譜可製作",
    noRecipesTitle: "沒有食譜",
    emptyHint: "點按 + 新增第一個食譜。",
    addFirst: "新增食譜",
    youNeed: "所需材料",
    importFrom: "選擇備份檔案……",
    pasteHeader: "或貼上備份文字",
    exportHeader: "備份文字",
    copyText: "複製文字",
    downloadFile: "下載檔案",
    done: "完成"
  });

  /* ---------------- Icons (SF Symbols–style) ---------------- */
  const ICON = {
    plus: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15"/></svg>',
    plusSm: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    minusSm: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>',
    back: '<svg width="13" height="21" viewBox="0 0 13 21" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 2L2.5 10.5 11 19"/></svg>',
    chev: '<svg width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5l5 5-5 5"/></svg>',
    search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg>',
    share: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8.5H6.5A1.5 1.5 0 0 0 5 10v9.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V10a1.5 1.5 0 0 0-1.5-1.5H16"/><path d="M12 14V2.5"/><path d="M8.5 6L12 2.5 15.5 6"/></svg>',
    book: '<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7M9 11h5"/></svg>'
  };

  /* ---------------- Rendering ---------------- */
  function applyChrome() {
    document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
    document.title = t("appTitle");
    renderStorageNote();
  }

  function nav(left, title, right, bordered) {
    return `<div class="nav${bordered ? " bordered" : ""}"><div class="nav-left">${left || ""}</div><div class="nav-title">${title ? esc(title) : ""}</div><div class="nav-right">${right || ""}</div></div>`;
  }
  function backBtn(action, label) {
    return `<button class="nav-btn" data-action="${action}" aria-label="${esc(t("back"))}">${ICON.back}<span class="back-label">&nbsp;${esc(label)}</span></button>`;
  }

  function render() {
    applyChrome();
    const v = $("#view");
    if (state.view === "edit") v.innerHTML = viewEdit();
    else if (state.view === "calc") v.innerHTML = viewCalc();
    else v.innerHTML = viewList();
    if (state.view === "calc") updateCalcResults();
    updateNavBorder();
  }

  function updateNavBorder() {
    const n = document.querySelector("#view > .nav");
    if (n) n.classList.toggle("bordered", window.scrollY > 4 || state.view === "edit");
  }
  window.addEventListener("scroll", updateNavBorder, { passive: true });

  // Called whenever the recipe set changes (incl. live updates from another device)
  function onRecipesChanged() {
    if (state.view === "edit") return; // never disturb a form being filled in
    if (state.view === "calc") {
      if (!getRecipe(state.calcId)) { state.view = "list"; render(); return; }
      if ($("#calcTarget")) { updateCalcResults(); return; }
    }
    if (state.view === "list") {
      const active = document.activeElement;
      const hadSearchFocus = active && active.id === "searchBox";
      const pos = hadSearchFocus ? active.selectionStart : null;
      render();
      if (hadSearchFocus) { const s = $("#searchBox"); if (s) { s.focus(); try { s.setSelectionRange(pos, pos); } catch (e) {} } }
      return;
    }
    render();
  }

  function viewList() {
    const langSeg = `<div class="segmented" role="group" aria-label="Language / 語言">
        <button type="button" data-lang="en" aria-pressed="${lang === "en"}">EN</button>
        <button type="button" data-lang="zh" aria-pressed="${lang === "zh"}">繁</button>
      </div>`;
    const left = `<button class="nav-btn icon" id="backupBtn" aria-label="${esc(t("backup"))}" title="${esc(t("backup"))}">${ICON.share}</button>`;
    const right = `${langSeg}<button class="nav-btn icon" data-action="new" aria-label="${esc(t("newRecipe"))}" title="${esc(t("newRecipe"))}">${ICON.plus}</button>`;
    const head = nav(left, "", right) + `<h1 class="large-title">${esc(t("myRecipes"))}</h1>`;

    if (!state.loaded) {
      return head + `<div class="loading"><div class="spinner"></div>${esc(state.slow ? t("loadSlow") : t("loading"))}</div>`;
    }
    if (state.loadError) {
      return head + `<div class="empty-state"><p>${esc(t("loadErr"))}</p></div>`;
    }
    const all = sortRecipes(state.recipes);
    if (!all.length) {
      return head + `<div class="empty-state">${ICON.book}<h2>${esc(t("noRecipesTitle"))}</h2><p>${esc(t("emptyHint"))}</p><button class="filled-btn" data-action="new">${esc(t("addFirst"))}</button></div>`;
    }
    const q = state.query.trim().toLowerCase();
    const items = q ? all.filter(r => r.name.toLowerCase().includes(q) || r.ingredients.some(i => i.name.toLowerCase().includes(q))) : all;
    const search = `<label class="search"><span class="sr-only">${esc(t("search"))}</span>${ICON.search}<input id="searchBox" type="search" placeholder="${esc(t("search"))}" value="${esc(state.query)}" autocomplete="off" enterkeyhint="search"></label>`;
    const list = items.length
      ? `<div class="section"><div class="group">${items.map(r => `
          <button class="cell" data-action="open" data-id="${esc(r.id)}">
            <div class="main">
              <div class="title">${esc(r.name)}</div>
              <div class="subtitle">${esc(t("makes", fmtOrig(r.yieldAmount), r.yieldUnit))} · ${esc(t("ingCount", r.ingredients.length))}</div>
            </div>
            <span class="chev">${ICON.chev}</span>
          </button>`).join("")}</div></div>`
      : `<div class="empty-state" style="padding-top:30px"><p>${esc(t("noMatch"))}</p></div>`;
    return head + search + list;
  }

  function ingRowHtml(ing, idx, invalid) {
    return `
      <div class="cell ing">
        <div class="ing-row" data-idx="${idx}">
          <button type="button" class="minus" data-action="del-ing" data-idx="${idx}" aria-label="${esc(t("remove"))}" title="${esc(t("remove"))}">${ICON.minusSm}</button>
          <input class="field${invalid && invalid.name ? " invalid" : ""}" data-f="name" value="${esc(ing.name)}" placeholder="${esc(t("ingNamePh"))}" aria-label="${esc(t("ingName"))} ${idx + 1}" maxlength="200">
          <input class="pill-input num${invalid && invalid.amount ? " invalid" : ""}" data-f="amount" value="${esc(ing.amount)}" inputmode="decimal" placeholder="0" aria-label="${esc(t("amount"))} ${idx + 1}">
          <input class="pill-input unit" data-f="unit" value="${esc(ing.unit)}" list="unitList" placeholder="${esc(t("unit"))}" aria-label="${esc(t("unit"))} ${idx + 1}" maxlength="40" autocapitalize="off" autocorrect="off">
        </div>
      </div>`;
  }

  function viewEdit() {
    const d = state.draft;
    const e = state.errors || {};
    const isNew = !state.editId;
    const head = nav(
      `<button class="nav-btn" data-action="cancel-edit">${esc(t("cancel"))}</button>`,
      isNew ? t("newRecipe") : t("editRecipe"),
      `<button class="nav-btn bold" data-action="save">${esc(t("save"))}</button>`,
      true
    );
    return head + `
      <form id="editForm" novalidate style="padding-top:22px">
        <div class="section">
          <div class="section-header">${esc(t("nameSection"))}</div>
          <div class="group">
            <div class="cell"><input class="field${e.name ? " invalid" : ""}" id="fName" value="${esc(d.name)}" placeholder="${esc(t("namePh"))}" aria-label="${esc(t("recipeName"))}" maxlength="200"></div>
          </div>
          ${e.name ? `<div class="section-footer error">${esc(t("errName"))}</div>` : ""}
        </div>

        <div class="section">
          <div class="section-header">${esc(t("yieldSection"))}</div>
          <div class="group">
            <div class="cell">
              <div class="yield-row">
                <span class="lbl">${esc(t("amount"))}</span>
                <input class="pill-input num${e.yield ? " invalid" : ""}" id="fYield" value="${esc(d.yieldAmount)}" inputmode="decimal" placeholder="35" aria-label="${esc(t("amount"))}">
                <input class="pill-input unit" id="fYieldUnit" value="${esc(d.yieldUnit)}" list="unitList" placeholder="pcs" aria-label="${esc(t("unit"))}" maxlength="40" autocapitalize="off" autocorrect="off">
              </div>
            </div>
          </div>
          ${e.yield ? `<div class="section-footer error">${esc(t("errYield"))}</div>` : ""}
        </div>

        <div class="section">
          <div class="section-header"><span>${esc(t("ingredients"))}</span><span>${esc(t("amount"))} · ${esc(t("unit"))}</span></div>
          <div class="group" id="ingGroup">
            <div id="ingRows">${d.ingredients.map((ing, i) => ingRowHtml(ing, i, e.rows && e.rows[i])).join("")}</div>
            <button type="button" class="cell action ing" data-action="add-ing"><span class="plus-circle">${ICON.plusSm}</span>${esc(t("addIngredient"))}</button>
          </div>
          ${e.ingNone ? `<div class="section-footer error">${esc(t("errIngNone"))}</div>` : ""}
          ${e.ingRow ? `<div class="section-footer error">${esc(t("errIngRow"))}</div>` : ""}
        </div>

        <div class="section">
          <div class="section-header">${esc(t("notes"))}</div>
          <div class="group">
            <div class="cell"><textarea class="field" id="fNotes" placeholder="${esc(t("notesPh"))}" aria-label="${esc(t("notes"))}" maxlength="20000">${esc(d.notes)}</textarea></div>
          </div>
        </div>

        ${isNew ? "" : `<div class="section"><div class="group"><button type="button" class="cell destructive" data-action="delete">${esc(t("deleteRecipe"))}</button></div></div>`}
        <button type="submit" class="sr-only" tabindex="-1">${esc(t("save"))}</button>
      </form>`;
  }

  function viewCalc() {
    const r = getRecipe(state.calcId);
    if (!r) return nav(backBtn("home", t("recipesBack")), "", "") + `<div class="empty-state"><p>${esc(t("notFound"))}</p></div>`;
    const quick = [0.5, 2, 3].map(m => r.yieldAmount * m).filter(v => v > 0);
    const chips = [r.yieldAmount, ...quick].map(v => `<button type="button" class="chip" data-action="set-target" data-v="${esc(fmtOrig(v))}">${esc(fmtOrig(v))} ${esc(r.yieldUnit)}</button>`).join("");
    return nav(backBtn("home", t("recipesBack")), "", `<button class="nav-btn" data-action="edit" data-id="${esc(r.id)}">${esc(t("edit"))}</button>`) + `
      <h1 class="detail-title" id="calcTitle">${esc(r.name)}</h1>
      <p class="detail-sub" id="calcBase">${esc(t("baseIs", fmtOrig(r.yieldAmount), r.yieldUnit))}</p>
      <div style="height:18px"></div>
      <div class="section">
        <label class="section-header" for="calcTarget">${esc(t("howMuch"))}</label>
        <div class="group">
          <div class="calc-cell">
            <input id="calcTarget" inputmode="decimal" value="${esc(state.target)}" placeholder="${esc(fmtOrig(r.yieldAmount))}" autocomplete="off" enterkeyhint="done">
            <span class="unit" id="calcUnit">${esc(r.yieldUnit)}</span>
          </div>
        </div>
        <div class="chips" id="calcChips">${chips}</div>
      </div>
      <div class="section">
        <div class="section-header"><span>${esc(t("youNeed"))}</span><span class="scale-badge" id="scaleBadge"></span></div>
        <div class="group" id="calcResults"></div>
      </div>
      <div class="section" id="notesPanel"></div>`;
  }

  function updateCalcResults() {
    const r = getRecipe(state.calcId);
    const box = $("#calcResults");
    if (!r || !box) return;
    $("#calcTitle").textContent = r.name;
    $("#calcUnit").textContent = r.yieldUnit;
    $("#calcBase").textContent = t("baseIs", fmtOrig(r.yieldAmount), r.yieldUnit);
    $("#calcTarget").placeholder = fmtOrig(r.yieldAmount);

    const target = toNum(state.target);
    const valid = isFinite(target) && target > 0;
    const f = valid ? target / r.yieldAmount : NaN;
    $("#scaleBadge").textContent = valid ? t("scaled", fmtFactor(f)) : "";
    if (!valid) {
      box.innerHTML = `<div class="cell placeholder-cell">${esc(t("enterAmount"))}</div>`;
    } else {
      box.innerHTML = r.ingredients.map(i => `
        <div class="cell res-cell">
          <div class="name">${esc(i.name)}</div>
          <div class="vals">
            <div class="new">${esc(fmt(i.amount * f))}<span class="u">${esc(i.unit)}</span></div>
            <div class="orig">${esc(t("origAmt"))} ${esc(fmtOrig(i.amount))}${i.unit ? " " + esc(i.unit) : ""}</div>
          </div>
        </div>`).join("");
    }
    const np = $("#notesPanel");
    if (r.notes && r.notes.trim()) {
      np.hidden = false;
      np.innerHTML = `<div class="section-header">${esc(t("notes"))}</div><div class="group"><div class="cell notes-text">${esc(r.notes)}</div></div>`;
    } else {
      np.hidden = true;
      np.innerHTML = "";
    }
  }

  /* ---------------- Edit form logic ---------------- */
  function blankIng() { return { name: "", amount: "", unit: "g" }; }
  function startEdit(id) {
    const r = id ? getRecipe(id) : null;
    state.editId = r ? r.id : null;
    state.draft = r ? {
      name: r.name,
      yieldAmount: fmtOrig(r.yieldAmount),
      yieldUnit: r.yieldUnit,
      notes: r.notes,
      ingredients: r.ingredients.map(i => ({ name: i.name, amount: fmtOrig(i.amount), unit: i.unit }))
    } : { name: "", yieldAmount: "", yieldUnit: "pcs", notes: "", ingredients: [blankIng(), blankIng(), blankIng()] };
    state.errors = null;
    state.view = "edit";
    render();
    window.scrollTo(0, 0);
    if (!r) { const n = $("#fName"); if (n) n.focus(); }
  }

  function readDraftFromForm() {
    const d = state.draft;
    d.name = $("#fName").value;
    d.yieldAmount = $("#fYield").value;
    d.yieldUnit = $("#fYieldUnit").value;
    d.notes = $("#fNotes").value;
    d.ingredients = Array.from(document.querySelectorAll("#ingRows .ing-row")).map(row => ({
      name: row.querySelector('[data-f="name"]').value,
      amount: row.querySelector('[data-f="amount"]').value,
      unit: row.querySelector('[data-f="unit"]').value
    }));
  }

  function validateDraft() {
    const d = state.draft;
    const e = { rows: [] };
    let bad = false;
    if (!d.name.trim()) { e.name = true; bad = true; }
    const y = toNum(d.yieldAmount);
    if (!(isFinite(y) && y > 0)) { e.yield = true; bad = true; }
    // ignore fully empty rows
    const used = [];
    d.ingredients.forEach((ing, i) => {
      const empty = !ing.name.trim() && String(ing.amount).trim() === "";
      if (empty) return;
      const a = toNum(ing.amount);
      const rowErr = {};
      if (!ing.name.trim()) rowErr.name = true;
      if (!(isFinite(a) && a >= 0)) rowErr.amount = true;
      if (rowErr.name || rowErr.amount) { e.rows[i] = rowErr; e.ingRow = true; bad = true; }
      used.push({ name: ing.name.trim(), amount: a, unit: ing.unit.trim() });
    });
    if (!used.length) { e.ingNone = true; bad = true; }
    return { ok: !bad, errors: e, ingredients: used, yieldAmount: y };
  }

  async function submitEdit() {
    readDraftFromForm();
    const v = validateDraft();
    if (!v.ok) {
      state.errors = v.errors;
      render();
      const firstBad = document.querySelector(".input.invalid");
      if (firstBad) firstBad.focus();
      return;
    }
    const d = state.draft;
    const prev = state.editId ? getRecipe(state.editId) : null;
    const recipe = normalize({
      id: prev ? prev.id : newId(),
      name: d.name,
      yieldAmount: v.yieldAmount,
      yieldUnit: d.yieldUnit,
      ingredients: v.ingredients,
      notes: d.notes,
      createdAt: prev ? prev.createdAt : Date.now(),
      updatedAt: Date.now()
    });
    const btn = document.querySelector('#view [data-action="save"]');
    if (btn) btn.disabled = true;
    try {
      await saveRecipe(recipe);
      toast(t("saved"));
      state.calcId = recipe.id;
      state.target = "";
      state.view = "calc";
      state.draft = null;
      render();
      window.scrollTo(0, 0);
    } catch (err) {
      if (btn) btn.disabled = false;
      toast(saveErrorMsg(err), true);
    }
  }

  /* ---------------- Sheets ---------------- */
  let lastFocus = null;
  function openModal(html) {
    lastFocus = document.activeElement;
    $("#modal").innerHTML = html;
    $("#overlay").hidden = false;
    const f = $("#modal").querySelector("button, input, textarea");
    if (f) f.focus({ preventScroll: true });
  }
  function closeModal() {
    $("#overlay").hidden = true;
    $("#modal").innerHTML = "";
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }
  function sheet(left, title, right, body) {
    return `<div class="sheet"><div class="grabber"></div>${nav(left, title, right)}<div class="sheet-body">${body}</div></div>`;
  }

  function openConfirmDelete() {
    const r = getRecipe(state.editId);
    if (!r) return;
    openModal(`
      <div class="action-sheet">
        <div class="action-group">
          <div class="action-head"><strong>${esc(t("confirmDelTitle"))}</strong>${esc(t("confirmDelBody", r.name))}</div>
          <button class="action-btn destructive after-head" data-action="confirm-delete">${esc(t("deleteRecipe"))}</button>
        </div>
        <div class="action-group"><button class="action-btn cancel" data-action="close-modal">${esc(t("cancel"))}</button></div>
      </div>`);
  }

  function openBackupMenu() {
    openModal(`
      <div class="action-sheet">
        <div class="action-group">
          <div class="action-head"><strong>${esc(t("backupTitle"))}</strong>${esc(t("backupIntro"))}</div>
          <button class="action-btn after-head" data-action="export">${esc(t("exportT"))}</button>
          <button class="action-btn" data-action="import">${esc(t("importT"))}</button>
        </div>
        <div class="action-group"><button class="action-btn cancel" data-action="close-modal">${esc(t("cancel"))}</button></div>
      </div>`);
  }

  function backupText() {
    return JSON.stringify({
      app: "ingredient-calculator",
      schema: 1,
      exportedAt: new Date().toISOString(),
      recipes: sortRecipes(state.recipes)
    }, null, 2);
  }

  function openExport() {
    const done = `<button class="nav-btn bold" data-action="close-modal">${esc(t("done"))}</button>`;
    if (!state.recipes.length) {
      openModal(sheet("", t("exportT"), done, `<p class="lead">${esc(t("nothingExport"))}</p>`));
      return;
    }
    openModal(sheet("", t("exportT"), done, `
      <p class="lead">${esc(t("exportBody"))}</p>
      <div class="section">
        <div class="group">
          <button class="cell action" data-action="download-export">${esc(t("downloadFile"))}</button>
          <button class="cell action" data-action="copy-export">${esc(t("copyText"))}</button>
        </div>
      </div>
      <div class="section">
        <div class="section-header">${esc(t("exportHeader"))}</div>
        <div class="group"><div class="cell"><textarea class="field" id="exportText" readonly>${esc(backupText())}</textarea></div></div>
      </div>`));
  }

  async function downloadBackup() {
    const text = backupText();
    const filename = `recipes-backup-${new Date().toISOString().slice(0, 10)}.json`;
    if (inFrame() && window.claude && typeof window.claude.use === "function") {
      try {
        const dl = await window.claude.use("downloads");
        if (dl) { await dl.save({ filename, data: text }); return; }
      } catch (e) {
        if (e && e.code === "declined") return;
        toast(t("downloadFail"), true);
        return;
      }
      toast(t("downloadFail"), true);
      return;
    }
    try {
      const blob = new Blob([text], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) { toast(t("downloadFail"), true); }
  }

  async function copyExport() {
    const ta = $("#exportText");
    if (!ta) return;
    try {
      await navigator.clipboard.writeText(ta.value);
      toast(t("copied"));
    } catch (e) {
      try { ta.focus(); ta.select(); if (document.execCommand("copy")) { toast(t("copied")); return; } } catch (e2) {}
      toast(t("copyFail"), true);
    }
  }

  function openImport() {
    openModal(sheet(
      `<button class="nav-btn" data-action="close-modal">${esc(t("cancel"))}</button>`,
      t("importT"),
      `<button class="nav-btn bold" data-action="do-import">${esc(t("importBtn"))}</button>`,
      `
      <p class="lead">${esc(t("importBody"))}</p>
      <div class="section">
        <div class="group">
          <label class="cell action tappable">${esc(t("importFrom"))}<input type="file" id="importFile" accept=".json,application/json,text/plain" class="sr-only"></label>
        </div>
        <div class="section-footer" id="importFileName">${esc(t("noFile"))}</div>
      </div>
      <div class="section">
        <div class="section-header">${esc(t("pasteHeader"))}</div>
        <div class="group"><div class="cell"><textarea class="field" id="importText" placeholder='{"app":"ingredient-calculator", …}'></textarea></div></div>
      </div>`));
  }

  function parseBackup(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { return null; }
    const list = Array.isArray(data) ? data : (data && Array.isArray(data.recipes) ? data.recipes : (data && data.name ? [data] : null));
    if (!list) return null;
    const out = list.map(normalize).filter(Boolean);
    return out.length ? out : null;
  }

  async function doImport() {
    const text = ($("#importText").value || "").trim();
    const list = text ? parseBackup(text) : null;
    if (!list) { toast(t("importErr"), true); return; }
    const btn = document.querySelector('#modal [data-action="do-import"]');
    if (btn) btn.disabled = true;
    let n = 0;
    try {
      for (const r of list) { await saveRecipe(r); n++; }
      closeModal();
      toast(t("importDone", n));
      if (state.view !== "edit") { state.view = "list"; render(); }
    } catch (err) {
      if (btn) btn.disabled = false;
      toast(saveErrorMsg(err), true);
      if (state.view !== "edit") render();
    }
  }

  /* ---------------- Events ---------------- */
  document.addEventListener("click", async (ev) => {
    const langBtn = ev.target.closest("[data-lang]");
    if (langBtn) {
      if (state.view === "edit" && state.draft) readDraftFromForm();
      lang = langBtn.dataset.lang;
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
      render();
      return;
    }
    if (ev.target.closest("#backupBtn")) { openBackupMenu(); return; }
    if (ev.target === $("#overlay")) { closeModal(); return; }

    const el = ev.target.closest("[data-action]");
    if (!el) return;
    const a = el.dataset.action;

    if (a === "new") startEdit(null);
    else if (a === "open") { state.calcId = el.dataset.id; state.target = ""; state.view = "calc"; render(); window.scrollTo(0, 0); const ti = $("#calcTarget"); if (ti) ti.focus(); }
    else if (a === "edit") startEdit(el.dataset.id);
    else if (a === "home") { state.view = "list"; render(); }
    else if (a === "cancel-edit") {
      const backTo = state.editId && getRecipe(state.editId) ? "calc" : "list";
      if (backTo === "calc") state.calcId = state.editId;
      state.view = backTo; state.draft = null; state.errors = null; render();
    }
    else if (a === "add-ing") {
      readDraftFromForm();
      state.draft.ingredients.push(blankIng());
      const rows = $("#ingRows");
      rows.insertAdjacentHTML("beforeend", ingRowHtml(state.draft.ingredients[state.draft.ingredients.length - 1], state.draft.ingredients.length - 1));
      rows.lastElementChild.querySelector("input").focus();
    }
    else if (a === "del-ing") {
      readDraftFromForm();
      const idx = Number(el.dataset.idx);
      state.draft.ingredients.splice(idx, 1);
      if (!state.draft.ingredients.length) state.draft.ingredients.push(blankIng());
      if (state.errors && state.errors.rows) state.errors.rows.splice(idx, 1);
      $("#ingRows").innerHTML = state.draft.ingredients.map((ing, i) => ingRowHtml(ing, i, state.errors && state.errors.rows && state.errors.rows[i])).join("");
    }
    else if (a === "save") submitEdit();
    else if (a === "delete") openConfirmDelete();
    else if (a === "confirm-delete") {
      const id = state.editId;
      closeModal();
      try {
        await deleteRecipe(id);
        toast(t("deleted"));
        state.view = "list"; state.draft = null; state.editId = null; render();
      } catch (err) { toast(saveErrorMsg(err), true); }
    }
    else if (a === "set-target") {
      state.target = el.dataset.v;
      const ti = $("#calcTarget"); if (ti) ti.value = state.target;
      updateCalcResults();
    }
    else if (a === "close-modal") closeModal();
    else if (a === "export") openExport();
    else if (a === "import") openImport();
    else if (a === "download-export") downloadBackup();
    else if (a === "copy-export") copyExport();
    else if (a === "do-import") doImport();
  });

  document.addEventListener("input", (ev) => {
    if (ev.target.id === "searchBox") {
      state.query = ev.target.value;
      const pos = ev.target.selectionStart;
      render();
      const s = $("#searchBox"); if (s) { s.focus(); try { s.setSelectionRange(pos, pos); } catch (e) {} }
    } else if (ev.target.id === "calcTarget") {
      state.target = ev.target.value;
      updateCalcResults();
    }
  });

  document.addEventListener("change", (ev) => {
    if (ev.target.id === "importFile") {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      $("#importFileName").textContent = file.name;
      const reader = new FileReader();
      reader.onload = () => { const ta = $("#importText"); if (ta) ta.value = String(reader.result || ""); };
      reader.onerror = () => toast(t("importErr"), true);
      reader.readAsText(file);
    }
  });

  document.addEventListener("submit", (ev) => {
    if (ev.target.id === "editForm") { ev.preventDefault(); submitEdit(); }
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && !$("#overlay").hidden) closeModal();
  });

  /* ---------------- Start ---------------- */
  render();
  initStorage();
})();
</script>
</body>
</html>
